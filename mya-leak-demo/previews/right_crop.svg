<text x="24" y="42" font-size="24" font-weight="800" fill="#0f172a">Where is the leak? A Worker postMessage leak, same process, two dumps</text>
<text x="24" y="70" font-size="14" fill="#475569">Sample: every 100 ms the page posts a 1 KB ArrayBuffer to a worker that never drains its queue. The copies pile up in C++, not in either JS heap.</text>
<text x="24" y="92" font-size="14" fill="#475569">Each node shows its exact dominator-tree retained size and type; the tree is topological top-to-bottom; cycle members are marked (↺) and keep their true retained size.</text>
